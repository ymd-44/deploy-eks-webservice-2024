name: Deploiement App service web via EKS (dev/prod)
on:
  push:
    branches:
      - main
env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-devops24-cluster
  #EKS_CLUSTER_NAME: eks-devops25
  MY_NAMESPACE: projet-devops
  TF_CLOUD_ORGANIZATION: tf-devops24
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
  GITLAB_WORKSPACE: "deploy-eks-webservice-2024"
  CONFIG_DIRECTORY: "./"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3
      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: plan-upload
        with:
          workspace: ${{ env.GITLAB_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true
      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        id: plan-run
        with:
          workspace: ${{ env.GITLAB_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true
      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.0.0
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: apply-upload
        with:
          workspace: ${{ env.GITLAB_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        id: apply-run
        with:
          workspace: ${{ env.GITLAB_WORKSPACE }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}
      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.0.0
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"
  development:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t my_image:latest .
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag image
        run: docker tag my_image:latest ${{ secrets.DOCKERHUB_USERNAME}}/my_image:latest
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my_image:latest
  production:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3
      - name: Install kubectl
        uses: azure/setup-kubectl@v2.0
        with:
          version: v1.24.0
        id: install
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}
      
      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{env.EKS_CLUSTER_NAME}} --region
          ${{env.AWS_REGION}}
      - name: Vérifier si le namespace "projet-devops" existe
        run: kubectl get namespace | grep ${{env.MY_NAMESPACE}}
        if: ${{ always() }}
        id: verify
        continue-on-error: true
      - name: Nettoyage de la config Kubernetes existante
        if: steps.verify.outcome == 'success'
        run: kubectl delete namespace ${{env.MY_NAMESPACE}}
      - name: Vérifier si le namespace "projet-devops" existe sinon le créer
        run: kubectl get namespace | grep ${{env.MY_NAMESPACE}} || kubectl create
          namespace ${{env.MY_NAMESPACE}}
        if: ${{ always() }}
      - name: Deploy to EKS
        run: kubectl apply -k ./
